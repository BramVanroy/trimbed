site_name: trimbed
site_description: Trim the vocabulary of a tokenizer (and optionally its model) down to the subset you actually need.
site_url: https://BramVanroy.github.io/trimbed/

repo_url: https://github.com/BramVanroy/trimbed
repo_name: BramVanroy/trimbed
edit_uri: edit/main/docs/

# Material for MkDocs theme configuration. See https://squidfunk.github.io/mkdocs-material/
theme:
  name: material
  custom_dir: docs/overrides
  features:
    # Adds a copy button to code blocks
    - content.code.copy
    # Enables inline code annotations in fenced code blocks
    - content.code.annotate
    # Shows the top-level nav as tabs
    - navigation.tabs
    # Keeps the top tabs visible while scrolling
    - navigation.tabs.sticky
    # Expands the sidebar into named sections
    - navigation.sections
    # Treats index pages as section landing pages
    - navigation.indexes
    # Adds a back-to-top button
    - navigation.top
    # Highlights matching terms in search results/pages
    - search.highlight
    # Shows live search suggestions while typing
    - search.suggest
    # Keeps the table of contents synced while scrolling
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      # The default Material light theme
      scheme: default
      # Main brand color used for the header and active elements
      primary: teal
      # Accent color for links, buttons, and highlights
      accent: amber
      # Icon/text shown in the theme switcher
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      # The default Material dark theme
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Build hook for custom MkDocs behavior during site generation
hooks:
  - docs/hooks.py

# Promote silent link/nav problems to warnings so `mkdocs build --strict`
# (run in CI) turns them into build failures instead of shipping dead links.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# Plugins extend MkDocs with search and API-doc generation
plugins:
  # Full-text search index used by the site search UI
  - search
  # Versioned documentation deployment and metadata for Material selector + canonical URLs
  - mike:
      # Keep canonical URLs pointing at the current stable alias
      canonical_version: latest
  # Cross-reference resolver used by mkdocstrings and markdown links.
  # Deliberately left at its defaults: `resolve_closest` would silently point a
  # typo'd reference at the nearest identifier instead of failing the build.
  - autorefs
  # Generates API reference pages from Python objects and docstrings
  - mkdocstrings:
      # Custom Jinja templates for mkdocstrings rendering
      # Custom override to direct users to the source code on Github directly from the API reference pages
      custom_templates: docs/overrides
      handlers:
        python:
          # Source roots used to import project modules
          paths: [src]
          options:
            # config.py and report.py document themselves through `Field(description=...)`.
            # Without this griffe drops every pydantic field from the rendered page.
            extensions:
              - griffe_pydantic:
                  schema: true
            # Parse docstrings using Google-style sections
            docstring_style: google
            docstring_options:
              # Google style treats each line of a `Returns:` block that sits at the base
              # indentation as a separate returned value, which turns every multi-line
              # description here into one table row per line. Nothing in trimbed returns a
              # documented tuple of named values, so read the whole block as one item.
              returns_multiple_items: false
              # For the same reason, a colon inside a return description ("e.g. `a: b`") is
              # prose, not a `name: description` split.
              returns_named_value: false
            # Show a link to the source code for each documented object
            show_source: true
            # Render the object name as the page heading
            show_root_heading: true
            # Include the object type (class/function/module) in headings
            show_symbol_type_heading: true
            # Include symbol types in the generated table of contents
            show_symbol_type_toc: true
            # Keep members in source-code order instead of alphabetical order
            members_order: source
            # Put signatures on a separate line for readability
            separate_signature: true
            # Show type annotations in signatures
            show_signature_annotations: true
            # Turn the types in a rendered signature into links to their own pages
            signature_crossrefs: true
            # Display Annotated types as their underlying type where possible
            unwrap_annotated: true
            # Fold __init__ docs into the class documentation block
            merge_init_into_class: true

# Extra metadata consumed by Material features like version selector and warnings
extra:
  version:
    # Render version selector entries from mike's versions.json
    provider: mike
    # Treat this alias as the latest/stable channel for warning logic
    default: latest

# Markdown extensions used by docs pages
markdown_extensions:
  # Enables !!! note/warning/etc. blocks
  # See https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/#admonition
  - admonition
  # Lets Markdown files include snippets from other files
  # See https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/#snippets
  - pymdownx.snippets:
      # Resolve snippet paths from the repository root
      base_path: .
  # Better code highlighting with optional line anchors and CSS classes
  # See https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/#highlight
  - pymdownx.highlight:
      # Add anchor links for individual code lines
      anchor_linenums: true
      # Wrap highlighted lines in spans for styling and linking
      line_spans: __span
      # Add language-specific CSS classes for fenced code blocks
      pygments_lang_class: true
  # Inline code highlighting using special syntax
  - pymdownx.inlinehilite
  # Allows nested fenced blocks, tabs, Mermaid, etc. inside Markdown
  - pymdownx.superfences
  # Lets admonitions be collapsible
  - pymdownx.details
  # Renders the option/term lists the CLI and config pages use
  - def_list
  # Adds sortable, aligned tables
  - tables
  # Builds the on-page table of contents from headings
  - toc:
      # Appends a permalink icon to each heading for easy linking
      permalink: true

# Navigation structure for the generated docs site
nav:
  - Home: index.md
  - Guides:
      - Command line: cli.md
      - Configuration: configuration.md
      - How selection works: selection.md
      - Trimming a model: trimming-a-model.md
      - Output and reports: output.md
      - Extending trimbed: extending.md
      - Examples: examples.md
  - API reference:
      - Pipeline: api/pipeline.md
      - Config: api/config.md
      - Report: api/report.md
      - Tokenizer:
          - Spec: api/spec.md
          - Selection: api/selection.md
          - Presets: api/presets.md
          - Counting: api/counting.md
          - Tokenizer trim: api/tokenizer_trim.md
          - Byte level: api/bytelevel.md
      - Model:
          - Loading: api/loading.md
          - Model trim: api/model_trim.md
          - Id remap: api/remap.md
          - Sidecar: api/sidecar.md
          - Verify: api/verify.md
      - Backends:
          - Registry: api/backends/registry.md
          - Base: api/backends/base.md
          - BPE: api/backends/bpe.md
          - WordPiece: api/backends/wordpiece.md
          - Unigram: api/backends/unigram.md
          - WordLevel: api/backends/wordlevel.md
      - CLI:
          - Router: api/cli/router.md
          - trim: api/cli/trim.md
          - count: api/cli/count.md
          - inspect: api/cli/inspect.md
          - presets: api/cli/presets.md
      - Exceptions: api/exceptions.md
